<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Code Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    html,body{margin:0;min-height:100%;background:#0b0c10;color:#fff;font-family:Inter,Arial,sans-serif}body{display:grid;place-items:center}.wrap{max-width:760px;padding:40px}.card{background:#15171c;border:1px solid #2a2d35;border-radius:18px;padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35)}h1{margin:0 0 10px;font-size:36px}p{color:#b8bdc8;line-height:1.6}.note{margin-top:20px;padding:14px;border-radius:10px;background:#20232b}.small{font-size:13px;color:#8e95a3}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Code Studio</h1>
    <p>The GitHub/Vercel project is connected. The full standalone editor migration is being moved into this repository.</p>
    <div class="note">This repository is now the source of truth for the Vercel build.</div>
    <p class="small">Next commit replaces this bootstrap page with the complete builder application.</p>
  </div>
</div>
</body>
</html>
