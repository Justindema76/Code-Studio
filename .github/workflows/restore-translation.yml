name: Restore French translation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-translation.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Repair translation handler
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('justinnovate-code-studio/editor/js/editor.js')
          s = p.read_text()
          marker = "  // ---------- title, save, unload guard ----------\n"
          code = """  // ---------- French translation ----------
  var translateBtn = el('jcsAutoTranslate');
  if(translateBtn){
    translateBtn.onclick = function(){
      var status = el('jcsStatus');
      translateBtn.disabled = true;
      status.textContent = 'Translating English to French...';
      fetch(DATA.translateUrl, {
        method: 'POST',
        credentials: 'same-origin',
        headers: { 'Content-Type': 'application/json', 'X-WP-Nonce': DATA.nonce },
        body: JSON.stringify({ data: slides })
      }).then(function(r){
        return r.text().then(function(text){
          var parsed; try { parsed = JSON.parse(text); } catch(e) { parsed = null; }
          if(!r.ok){ throw new Error((parsed && parsed.message) ? parsed.message : ('HTTP ' + r.status)); }
          return parsed;
        });
      }).then(function(result){
        if(!result || !Array.isArray(result.data)) throw new Error('Translation service returned no banner data.');
        slides = result.data.map(function(slide){ return Object.assign(defaults(), slide); });
        active = Math.min(active, slides.length - 1);
        loadFields(); renderAll(); markDirty();
        status.textContent = 'French translation ready - click Save';
        translateBtn.disabled = false;
      }).catch(function(err){
        status.textContent = 'Translation failed: ' + err.message;
        translateBtn.disabled = false;
      });
    };
  }

"""
          if "translateBtn.onclick" not in s:
              if marker not in s:
                  raise SystemExit('Could not locate editor save section')
              s = s.replace(marker, code + marker, 1)
          p.write_text(s)

          m = Path('justinnovate-code-studio/justinnovate-code-studio.php')
          t = m.read_text()
          import re
          t = re.sub(r'\* Version: [0-9.]+', '* Version: 0.3.24', t, count=1)
          t = re.sub(r"define\( 'JCS_VERSION', '[0-9.]+' \);", "define( 'JCS_VERSION', '0.3.24' );", t, count=1)
          m.write_text(t)
          PY

      - name: Validate source
        run: |
          node --check justinnovate-code-studio/editor/js/editor.js
          php -l justinnovate-code-studio/justinnovate-code-studio.php

      - name: Commit source fix
        run: |
          git config user.name "Justin DeMatteis"
          git config user.email "160768253+Justindema76@users.noreply.github.com"
          git add justinnovate-code-studio/editor/js/editor.js justinnovate-code-studio/justinnovate-code-studio.php
          git commit -m "Restore French translation action"
          git push