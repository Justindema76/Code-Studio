name: Deploy standalone Code Studio

on:
  push:
    branches: [standalone-supabase, main]
    paths:
      - 'standalone/**'
      - '.github/workflows/deploy-standalone.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: code-studio-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: standalone/package-lock.json
      - run: npm ci
        working-directory: standalone
      - run: npm run build -- --base /Code-Studio/
        working-directory: standalone
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: standalone/dist
      - id: deployment
        uses: actions/deploy-pages@v4
