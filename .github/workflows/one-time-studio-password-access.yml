name: One-time Code Studio shared password access

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-studio-password-access.yml'

permissions:
  contents: write

jobs:
  update-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update Code Studio authentication at source
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          front_path = Path('justinnovate-code-studio/includes/class-jcs-frontend.php')
          front = front_path.read_text()

          # Add standalone access constants once.
          if "ACCESS_HASH_OPTION" not in front:
              front = front.replace(
                  "\tconst MIGRATION_OPTION   = 'jcs_standalone_route_migrated';\n",
                  "\tconst MIGRATION_OPTION   = 'jcs_standalone_route_migrated';\n"
                  "\tconst ACCESS_HASH_OPTION = 'jcs_studio_access_password_hash';\n"
                  "\tconst ACCESS_COOKIE      = 'jcs_studio_access';\n"
                  "\tconst ACCESS_TTL         = 2592000; // 30 days.\n"
              )

          old_require = re.compile(r"\n\tprivate function require_access\(\) \{.*?\n\t\}\n\n\t/\*\*\n\t \* Match /code-studio/", re.S)
          new_require = r'''
	private function access_hash() {
		return (string) get_option( self::ACCESS_HASH_OPTION, '' );
	}

	private function access_signature( $expires, $hash ) {
		return hash_hmac( 'sha256', (string) $expires . '|' . $hash, wp_salt( 'auth' ) );
	}

	private function set_access_cookie() {
		$hash = $this->access_hash();
		if ( '' === $hash ) return;
		$expires = time() + self::ACCESS_TTL;
		$value = $expires . '.' . $this->access_signature( $expires, $hash );
		setcookie( self::ACCESS_COOKIE, $value, array(
			'expires'  => $expires,
			'path'     => '/',
			'secure'   => is_ssl(),
			'httponly' => true,
			'samesite' => 'Lax',
		) );
		$_COOKIE[ self::ACCESS_COOKIE ] = $value;
	}

	private function clear_access_cookie() {
		setcookie( self::ACCESS_COOKIE, '', array(
			'expires'  => time() - HOUR_IN_SECONDS,
			'path'     => '/',
			'secure'   => is_ssl(),
			'httponly' => true,
			'samesite' => 'Lax',
		) );
		unset( $_COOKIE[ self::ACCESS_COOKIE ] );
	}

	public function has_access() {
		if ( current_user_can( 'edit_posts' ) ) return true;
		$hash = $this->access_hash();
		if ( '' === $hash || empty( $_COOKIE[ self::ACCESS_COOKIE ] ) ) return false;
		$parts = explode( '.', (string) wp_unslash( $_COOKIE[ self::ACCESS_COOKIE ] ), 2 );
		if ( 2 !== count( $parts ) || ! ctype_digit( $parts[0] ) ) return false;
		$expires = (int) $parts[0];
		if ( $expires < time() ) return false;
		$expected = $this->access_signature( $expires, $hash );
		return hash_equals( $expected, (string) $parts[1] );
	}

	private function require_access() {
		if ( isset( $_GET['jcs_logout'] ) ) {
			$this->clear_access_cookie();
			wp_safe_redirect( $this->dashboard_url() );
			exit;
		}

		if ( $this->has_access() ) return;

		$error = '';
		if ( 'POST' === strtoupper( isset( $_SERVER['REQUEST_METHOD'] ) ? $_SERVER['REQUEST_METHOD'] : '' )
			&& isset( $_POST['jcs_action'] )
			&& 'access_login' === sanitize_key( wp_unslash( $_POST['jcs_action'] ) ) ) {
			$password = isset( $_POST['jcs_password'] ) ? (string) wp_unslash( $_POST['jcs_password'] ) : '';
			$hash = $this->access_hash();
			if ( '' !== $hash && wp_check_password( $password, $hash ) ) {
				$this->set_access_cookie();
				wp_safe_redirect( $this->dashboard_url() );
				exit;
			}
			$error = 'Incorrect Code Studio password.';
		}

		$this->render_access_login( $error );
		exit;
	}

	private function render_access_login( $error = '' ) {
		$configured = '' !== $this->access_hash();
		nocache_headers();
		status_header( 200 );
		?>
<!doctype html>
<html <?php language_attributes(); ?>>
<head>
	<meta charset="<?php bloginfo( 'charset' ); ?>">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex,nofollow,noarchive">
	<title>Code Studio Access</title>
	<style>
		*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f5f6f8;color:#17191d}body{min-height:100vh;display:grid;place-items:center;padding:24px}.jcs-login{width:min(430px,100%);background:#fff;border:1px solid #e3e6eb;border-radius:16px;padding:34px;box-shadow:0 18px 50px rgba(17,24,39,.1)}.brand{font-size:12px;letter-spacing:.18em;font-weight:800;color:#3157DF}.jcs-login h1{margin:8px 0 8px;font-size:30px}.jcs-login p{margin:0 0 22px;color:#68707c;line-height:1.5}.jcs-login label{display:block;font-weight:700;font-size:13px;margin-bottom:7px}.jcs-login input{width:100%;height:46px;border:1px solid #cfd4dc;border-radius:9px;padding:0 13px;font-size:16px}.jcs-login button{width:100%;height:46px;margin-top:14px;border:0;border-radius:9px;background:#3157DF;color:#fff;font-weight:800;font-size:14px;cursor:pointer}.error{background:#fff1f0;color:#b42318;border:1px solid #ffd5d2;padding:10px 12px;border-radius:8px;margin-bottom:16px;font-size:13px}.setup{background:#fff8e6;color:#7a4b00;border:1px solid #f4d88a;padding:12px;border-radius:8px;font-size:13px;line-height:1.45}
	</style>
</head>
<body>
	<div class="jcs-login">
		<div class="brand">JUSTINNOVATE</div>
		<h1>Code Studio</h1>
		<?php if ( $configured ) : ?>
			<p>Enter the Code Studio password to continue. No WordPress account is required.</p>
			<?php if ( $error ) : ?><div class="error"><?php echo esc_html( $error ); ?></div><?php endif; ?>
			<form method="post" action="<?php echo esc_url( $this->dashboard_url() ); ?>">
				<input type="hidden" name="jcs_action" value="access_login">
				<label for="jcs-password">Password</label>
				<input id="jcs-password" name="jcs_password" type="password" autocomplete="current-password" required autofocus>
				<button type="submit">Enter Studio</button>
			</form>
		<?php else : ?>
			<div class="setup">A shared Studio password has not been set yet. Sign in to WordPress once as an administrator, open <strong>/code-studio/</strong>, and set the shared password there. Everyone else will then use only this Code Studio login.</div>
		<?php endif; ?>
	</div>
</body>
</html>
		<?php
	}

	/**
	 * Match /code-studio/'''
          front, count = old_require.subn('\n' + new_require, front, count=1)
          if count != 1:
              raise SystemExit('Could not replace frontend access block')

          # Add password-management action before normal create/duplicate/delete actions.
          marker = "\t\tif ( 'create' === $action ) {\n"
          if "set_access_password" not in front:
              access_action = """		if ( 'set_access_password' === $action ) {
			if ( ! current_user_can( 'manage_options' ) ) wp_die( esc_html__( 'Not allowed.', 'jcs' ) );
			check_admin_referer( 'jcs_set_access_password', 'jcs_nonce' );
			$password = isset( $_POST['access_password'] ) ? (string) wp_unslash( $_POST['access_password'] ) : '';
			if ( strlen( $password ) < 8 ) wp_die( esc_html__( 'Use at least 8 characters for the Code Studio password.', 'jcs' ) );
			update_option( self::ACCESS_HASH_OPTION, wp_hash_password( $password ), false );
			wp_safe_redirect( add_query_arg( 'password_saved', '1', $this->dashboard_url() ) );
			exit;
		}

"""
              front = front.replace(marker, access_action + marker, 1)

          front = front.replace(
              "\t\t\tif ( ! current_user_can( 'edit_post', $id ) ) {\n\t\t\t\twp_die( esc_html__( 'Not allowed.', 'jcs' ) );\n\t\t\t}\n",
              "\t\t\tif ( ! $this->has_access() ) {\n\t\t\t\twp_die( esc_html__( 'Not allowed.', 'jcs' ) );\n\t\t\t}\n",
              1
          )
          front = front.replace(
              "\t\t\tif ( ! current_user_can( 'delete_post', $id ) ) {\n\t\t\t\twp_die( esc_html__( 'Not allowed.', 'jcs' ) );\n\t\t\t}\n",
              "\t\t\tif ( ! $this->has_access() ) {\n\t\t\t\twp_die( esc_html__( 'Not allowed.', 'jcs' ) );\n\t\t\t}\n",
              1
          )

          # Replace sidebar identity/footer with shared-access logout and admin password control.
          old_footer = "\t\t\t<div class=\"jcs-side-bottom\">Signed in as <?php echo esc_html( $user->display_name ); ?><br><a href=\"<?php echo esc_url( wp_logout_url( home_url( '/' ) ) ); ?>\">Log out</a></div>"
          new_footer = """			<?php if ( current_user_can( 'manage_options' ) ) : ?>
			<div style="margin-top:auto;padding:16px 10px 8px;border-top:1px solid rgba(255,255,255,.12)">
				<form method="post" action="<?php echo esc_url( $this->dashboard_url() ); ?>">
					<input type="hidden" name="jcs_action" value="set_access_password">
					<?php wp_nonce_field( 'jcs_set_access_password', 'jcs_nonce' ); ?>
					<label style="display:block;font-size:11px;color:#9ca3af;margin-bottom:6px">Shared Studio password</label>
					<input name="access_password" type="password" minlength="8" autocomplete="new-password" placeholder="Set / change password" style="width:100%;padding:9px;border:0;border-radius:7px;margin-bottom:7px">
					<button type="submit" style="width:100%;padding:9px;border:0;border-radius:7px;background:#374151;color:#fff;font-weight:700;cursor:pointer">Save access password</button>
				</form>
			</div>
			<?php endif; ?>
			<div class="jcs-side-bottom">
				<?php if ( is_user_logged_in() ) : ?>Signed in as <?php echo esc_html( $user->display_name ); ?><br><a href="<?php echo esc_url( wp_logout_url( home_url( '/' ) ) ); ?>">WordPress log out</a>
				<?php else : ?>Code Studio access<br><a href="<?php echo esc_url( add_query_arg( 'jcs_logout', '1', $this->dashboard_url() ) ); ?>">Log out</a><?php endif; ?>
			</div>"""
          if old_footer not in front:
              raise SystemExit('Could not find frontend footer')
          front = front.replace(old_footer, new_footer, 1)

          front_path.write_text(front)

          # Allow the standalone authenticated session to render the editor.
          editor_path = Path('justinnovate-code-studio/includes/class-jcs-editor.php')
          editor = editor_path.read_text()
          old_editor_perm = "\t\tif ( ! current_user_can( 'edit_post', $post_id ) ) {\n\t\t\twp_die( esc_html__( 'You do not have permission to edit this.', 'jcs' ) );\n\t\t}\n"
          new_editor_perm = "\t\t$can_edit = $frontend ? JCS_Frontend::instance()->has_access() : current_user_can( 'edit_post', $post_id );\n\t\tif ( ! $can_edit ) {\n\t\t\twp_die( esc_html__( 'You do not have permission to edit this.', 'jcs' ) );\n\t\t}\n"
          if old_editor_perm not in editor:
              raise SystemExit('Could not find editor permission block')
          editor = editor.replace(old_editor_perm, new_editor_perm, 1)
          editor_path.write_text(editor)

          # Let REST saves/translation use the same standalone session cookie.
          rest_path = Path('justinnovate-code-studio/includes/class-jcs-rest.php')
          rest = rest_path.read_text()
          rest_pat = re.compile(r"\tpublic function can_edit\( \$request \) \{.*?\n\t\}\n", re.S)
          rest_new = """	public function can_edit( $request ) {
		if ( class_exists( 'JCS_Frontend' ) && JCS_Frontend::instance()->has_access() ) return true;
		$id = (int) $request->get_param( 'id' );
		if ( $id ) return current_user_can( 'edit_post', $id );
		return current_user_can( 'edit_posts' );
	}
"""
          rest, count = rest_pat.subn(rest_new, rest, count=1)
          if count != 1:
              raise SystemExit('Could not replace REST permission block')
          rest_path.write_text(rest)

          # Bump plugin version to invalidate cached assets and mark the auth release.
          main_path = Path('justinnovate-code-studio/justinnovate-code-studio.php')
          main = main_path.read_text()
          main = re.sub(r'\* Version: [0-9.]+', '* Version: 0.3.22', main, count=1)
          main = re.sub(r"define\( 'JCS_VERSION', '[0-9.]+' \);", "define( 'JCS_VERSION', '0.3.22' );", main, count=1)
          main_path.write_text(main)
          PY

      - name: Validate PHP
        run: |
          php -l justinnovate-code-studio/includes/class-jcs-frontend.php
          php -l justinnovate-code-studio/includes/class-jcs-editor.php
          php -l justinnovate-code-studio/includes/class-jcs-rest.php
          php -l justinnovate-code-studio/justinnovate-code-studio.php

      - name: Commit clean source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add justinnovate-code-studio/includes/class-jcs-frontend.php justinnovate-code-studio/includes/class-jcs-editor.php justinnovate-code-studio/includes/class-jcs-rest.php justinnovate-code-studio/justinnovate-code-studio.php
          git diff --cached --quiet && exit 0
          git commit -m "Add standalone Code Studio password access"
          git push
