name: Package Code Studio Plugin

on:
  push:
    branches: [main]
    paths:
      - 'justinnovate-code-studio/**'
      - '.github/workflows/package-plugin.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create plugin ZIP
        run: zip -r justinnovate-code-studio.zip justinnovate-code-studio
      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: justinnovate-code-studio-plugin
          path: justinnovate-code-studio.zip
