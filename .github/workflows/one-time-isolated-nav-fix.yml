name: One-time isolated navigation source fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-isolated-nav-fix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix navigation at source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('justinnovate-code-studio/editor/js/editor.js')
          s = p.read_text()

          # Give exported navigation controls their own namespace so Magento/Adobe rules cannot collide.
          s = s.replace('class="csx-arrow csx-prev"', 'class="jcsx-nav jcsx-nav-prev"')
          s = s.replace('class="csx-arrow csx-next"', 'class="jcsx-nav jcsx-nav-next"')
          s = s.replace('.csx-arrow', '.jcsx-nav')
          s = s.replace('.csx-prev', '.jcsx-nav-prev')
          s = s.replace('.csx-next', '.jcsx-nav-next')

          # Make the controls real buttons and put the critical layout directly on them as a final host-CSS shield.
          old_prev = "'  <span class=\"jcsx-nav jcsx-nav-prev\" role=\"button\" tabindex=\"0\" aria-label=\"Previous slide\" style=\"background:rgba('+hexRgb(s0.arrowBg)+','+(s0.arrowBgOpacity/100)+');border:1px solid rgba('+hexRgb(s0.arrowBorderColor)+','+(s0.arrowBorderOpacity/100)+');color:'+s0.arrowIconColor+';\">&#8249;</span>\\n' +"
          new_prev = "'  <button type=\"button\" class=\"jcsx-nav jcsx-nav-prev\" aria-label=\"Previous slide\" style=\"position:absolute!important;display:flex!important;align-items:center!important;justify-content:center!important;top:50%!important;left:20px!important;right:auto!important;transform:translateY(-50%)!important;z-index:2147483000!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;margin:0!important;padding:0!important;width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important;max-width:44px!important;max-height:44px!important;border-radius:9999px!important;background:rgba('+hexRgb(s0.arrowBg)+','+(s0.arrowBgOpacity/100)+')!important;border:1px solid rgba('+hexRgb(s0.arrowBorderColor)+','+(s0.arrowBorderOpacity/100)+')!important;color:'+s0.arrowIconColor+'!important;font:400 28px/1 Arial,sans-serif!important;text-indent:0!important;text-transform:none!important;appearance:none!important;-webkit-appearance:none!important;cursor:pointer!important;\">&#8249;</button>\\n' +"
          old_next = "'  <span class=\"jcsx-nav jcsx-nav-next\" role=\"button\" tabindex=\"0\" aria-label=\"Next slide\" style=\"background:rgba('+hexRgb(s0.arrowBg)+','+(s0.arrowBgOpacity/100)+');border:1px solid rgba('+hexRgb(s0.arrowBorderColor)+','+(s0.arrowBorderOpacity/100)+');color:'+s0.arrowIconColor+';\">&#8250;</span>\\n' +"
          new_next = "'  <button type=\"button\" class=\"jcsx-nav jcsx-nav-next\" aria-label=\"Next slide\" style=\"position:absolute!important;display:flex!important;align-items:center!important;justify-content:center!important;top:50%!important;right:20px!important;left:auto!important;transform:translateY(-50%)!important;z-index:2147483000!important;visibility:visible!important;opacity:1!important;pointer-events:auto!important;margin:0!important;padding:0!important;width:44px!important;height:44px!important;min-width:44px!important;min-height:44px!important;max-width:44px!important;max-height:44px!important;border-radius:9999px!important;background:rgba('+hexRgb(s0.arrowBg)+','+(s0.arrowBgOpacity/100)+')!important;border:1px solid rgba('+hexRgb(s0.arrowBorderColor)+','+(s0.arrowBorderOpacity/100)+')!important;color:'+s0.arrowIconColor+'!important;font:400 28px/1 Arial,sans-serif!important;text-indent:0!important;text-transform:none!important;appearance:none!important;-webkit-appearance:none!important;cursor:pointer!important;\">&#8250;</button>\\n' +"
          if old_prev not in s or old_next not in s:
              raise SystemExit('Arrow markup source did not match expected code; refusing a partial edit.')
          s = s.replace(old_prev, new_prev, 1).replace(old_next, new_next, 1)

          # Ensure the unique nav rule has the same host-proof properties in builder, live preview, and exported embed.
          s = s.replace('z-index:999!important;', 'z-index:2147483000!important;')

          # Keep mobile navigation explicit and host-proof.
          s = s.replace('.jcsx-nav{top:auto;bottom:18px;transform:none}', '.jcsx-nav{top:auto!important;bottom:18px!important;transform:none!important}')
          s = s.replace('.jcsx-nav-prev{left:auto;right:82px}', '.jcsx-nav-prev{left:auto!important;right:82px!important}')
          s = s.replace('.jcsx-nav-next{right:26px}', '.jcsx-nav-next{right:26px!important;left:auto!important}')

          # Verify there is no old arrow class left in generated output code.
          if 'csx-arrow' in s or 'csx-prev' in s or 'csx-next' in s:
              raise SystemExit('Old arrow classes still remain; refusing to commit.')

          p.write_text(s)

          # Bump version so browsers cannot keep serving the old editor.js.
          q = Path('justinnovate-code-studio/justinnovate-code-studio.php')
          t = q.read_text()
          t = t.replace('Version: 0.3.20', 'Version: 0.3.21')
          t = t.replace("define( 'JCS_VERSION', '0.3.20' );", "define( 'JCS_VERSION', '0.3.21' );")
          q.write_text(t)
          PY

          node --check justinnovate-code-studio/editor/js/editor.js
          php -l justinnovate-code-studio/justinnovate-code-studio.php

          rm .github/workflows/one-time-isolated-nav-fix.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add justinnovate-code-studio/editor/js/editor.js justinnovate-code-studio/justinnovate-code-studio.php .github/workflows/one-time-isolated-nav-fix.yml
          git commit -m "Isolate slider navigation from Magento CSS"
          git push
