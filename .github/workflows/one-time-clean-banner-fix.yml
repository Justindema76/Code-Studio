name: One-time clean banner fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-time-clean-banner-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix generator at the source and remove hotfix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          editor = Path('justinnovate-code-studio/editor/js/editor.js')
          s = editor.read_text()
          original = s

          # 1) Host-isolation typography rules must never force arrows to position:relative.
          marker = ",#'+instanceId+' .csx-arrow{font-style:normal!important"
          if marker not in s:
              raise SystemExit('Expected arrow in typography isolation selector was not found')
          s = s.replace(",#'+instanceId+' .csx-arrow{font-style:normal!important", "{font-style:normal!important", 1)

          # 2) Make arrow positioning part of the generated self-contained CSS itself.
          old = "#'+instanceId+' .csx-arrow{display:flex!important;align-items:center!important;justify-content:center!important;"
          new = "#'+instanceId+' .csx-arrow{display:flex!important;position:absolute!important;top:50%!important;transform:translateY(-50%)!important;opacity:1!important;visibility:visible!important;pointer-events:auto!important;z-index:999!important;align-items:center!important;justify-content:center!important;"
          if old not in s:
              raise SystemExit('Primary arrow CSS rule was not found')
          s = s.replace(old, new, 1)

          old = "#'+instanceId+' .csx-arrow{position:absolute;top:50%;z-index:6;width:44px;height:44px;border-radius:50%;font-size:28px;line-height:1;cursor:pointer;transform:translateY(-50%)}"
          new = "#'+instanceId+' .csx-arrow{position:absolute!important;top:50%!important;z-index:999!important;width:44px!important;height:44px!important;border-radius:50%!important;font-size:28px!important;line-height:1!important;cursor:pointer!important;transform:translateY(-50%)!important;opacity:1!important;visibility:visible!important;pointer-events:auto!important}"
          if old not in s:
              raise SystemExit('Secondary arrow CSS rule was not found')
          s = s.replace(old, new, 1)

          old = "#'+instanceId+' .csx-prev{left:20px}#'+instanceId+' .csx-next{right:20px}"
          new = "#'+instanceId+' .csx-prev{left:20px!important;right:auto!important}#'+instanceId+' .csx-next{right:20px!important;left:auto!important}"
          if old not in s:
              raise SystemExit('Desktop arrow side rules were not found')
          s = s.replace(old, new, 1)

          old = "  #'+instanceId+' .csx-arrow{top:auto;bottom:18px;transform:none}"
          new = "  #'+instanceId+' .csx-arrow{top:auto!important;bottom:18px!important;transform:none!important}"
          if old not in s:
              raise SystemExit('Mobile arrow positioning rule was not found')
          s = s.replace(old, new, 1)

          old = "  #'+instanceId+' .csx-prev{left:auto;right:82px}#'+instanceId+' .csx-next{right:26px}"
          new = "  #'+instanceId+' .csx-prev{left:auto!important;right:82px!important}#'+instanceId+' .csx-next{right:26px!important;left:auto!important}"
          if old not in s:
              raise SystemExit('Mobile arrow side rules were not found')
          s = s.replace(old, new, 1)

          # 3) Override Magento page-main padding only when this exported banner is actually running there.
          anchor = "'  if(!root||root.dataset.jcsInit)return; root.dataset.jcsInit=\"1\";\\n' +"
          insert = anchor + "\n'  var hostMain=root.closest?root.closest(\"main#maincontent.page-main-full-width\"):null;if(hostMain){hostMain.style.setProperty(\"padding-top\",\"0\",\"important\");hostMain.style.setProperty(\"padding-bottom\",\"0\",\"important\");}\\n' +"
          if anchor not in s:
              raise SystemExit('Generated script initialization anchor was not found')
          s = s.replace(anchor, insert, 1)

          if s == original:
              raise SystemExit('No editor.js changes were made')
          editor.write_text(s)

          # Remove the temporary editor-only hotfix enqueue. The generator is now authoritative.
          php = Path('justinnovate-code-studio/includes/class-jcs-editor.php')
          p = php.read_text()
          hotfix_enqueue = "\t\twp_enqueue_script( 'jcs-arrow-hotfix', JCS_PLUGIN_URL . 'editor/js/arrow-hotfix.js', array( 'jcs-editor' ), JCS_VERSION, true );\n"
          if hotfix_enqueue not in p:
              raise SystemExit('Hotfix enqueue line was not found')
          php.write_text(p.replace(hotfix_enqueue, '', 1))

          # Cache-bust the corrected generator.
          main = Path('justinnovate-code-studio/justinnovate-code-studio.php')
          m = main.read_text()
          if 'Version: 0.3.19' not in m or "define( 'JCS_VERSION', '0.3.19' );" not in m:
              raise SystemExit('Expected 0.3.19 version markers were not found')
          m = m.replace('Version: 0.3.19', 'Version: 0.3.20', 1)
          m = m.replace("define( 'JCS_VERSION', '0.3.19' );", "define( 'JCS_VERSION', '0.3.20' );", 1)
          main.write_text(m)

          # Remove the patch file entirely.
          hotfix = Path('justinnovate-code-studio/editor/js/arrow-hotfix.js')
          if hotfix.exists():
              hotfix.unlink()

          # Remove this one-time workflow from the finished repository.
          self_workflow = Path('.github/workflows/one-time-clean-banner-fix.yml')
          if self_workflow.exists():
              self_workflow.unlink()
          PY

      - name: Validate JavaScript and PHP
        run: |
          node --check justinnovate-code-studio/editor/js/editor.js
          php -l justinnovate-code-studio/includes/class-jcs-editor.php
          php -l justinnovate-code-studio/justinnovate-code-studio.php
          test ! -e justinnovate-code-studio/editor/js/arrow-hotfix.js
          ! grep -q "jcs-arrow-hotfix" justinnovate-code-studio/includes/class-jcs-editor.php

      - name: Commit clean source fix
        run: |
          git config user.name "Code Studio Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix banner arrows and Magento spacing at source"
          git push origin main

      - name: Deploy corrected plugin over FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./justinnovate-code-studio/
          server-dir: ${{ secrets.FTP_PLUGIN_DIR }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
